# ─── FORMULAS ────────────────────────────────────────────────────────────────

formulas:
  - name: effective_capacity
    status: active
    source: design/gdd/container.md
    referenced_by:
      - design/gdd/container.md
      - design/gdd/item-registry.md
      - design/gdd/conveyor.md
      - design/gdd/item-io-accessor.md
      - design/gdd/group-processing-devices.md
    variables: [slot.capacity, itemDef.maxStack]
    output_range: [1, 3000]
    expression: "min(slot.capacity, itemDef.maxStack)"
    notes: "spec s6.1.1. All acceptance math uses this, never raw slot.capacity."
    added: 2026-09-20
    revised: ""

  - name: accessor_exact
    status: active
    source: design/gdd/item-io-accessor.md
    referenced_by:
      - design/gdd/item-io-accessor.md
      - design/gdd/conveyor.md
    variables: [sourceCount, amount, acceptable]
    output_range: [0, 3000]
    expression: "amount if sourceCount >= amount and acceptable >= amount else 0"
    notes: "spec s8.4"
    added: 2026-09-20
    revised: ""

  - name: accessor_upto
    status: active
    source: design/gdd/item-io-accessor.md
    referenced_by:
      - design/gdd/item-io-accessor.md
    variables: [sourceCount, amount, acceptable]
    output_range: [0, 3000]
    expression: "min(sourceCount, amount, acceptable)"
    notes: "spec s8.5"
    added: 2026-09-20
    revised: ""

  - name: accessor_keep
    status: active
    source: design/gdd/item-io-accessor.md
    referenced_by:
      - design/gdd/item-io-accessor.md
      - design/gdd/tech-unlock.md
    variables: [sourceCount, amount, acceptable]
    output_range: [0, 3000]
    expression: "min(max(sourceCount - amount, 0), 3000, acceptable)"
    notes: "spec s8.6; amount = desired remaining stock"
    added: 2026-09-20
    revised: ""

  - name: mechanical_power
    status: active
    source: design/gdd/mechanical-power.md
    referenced_by:
      - design/gdd/mechanical-power.md
      - design/gdd/machine-processing.md
      - design/gdd/economy-ledger.md
      - design/gdd/machine-inspection-ui.md
    variables: [tau, omega]
    output_range: [0, 100000]
    expression: "P = tau * omega"
    notes: "spec s16; Tier 1 content stays under 1e5 W"
    added: 2026-09-20
    revised: ""

  - name: gear_pair
    status: active
    source: design/gdd/mechanical-power.md
    referenced_by:
      - design/gdd/mechanical-power.md
      - design/gdd/tech-unlock.md
    variables: [omega_in, tau_in_max, N_in, N_out, eta_gear]
    output_range: [0, 100000]
    expression: "r = N_out/N_in; omega_out = omega_in / r; tau_out_max = tau_in_max * r * eta_gear; direction flips"
    added: 2026-09-20
    revised: ""

  - name: delivered_power
    status: active
    source: design/gdd/mechanical-power.md
    referenced_by:
      - design/gdd/mechanical-power.md
      - design/gdd/machine-processing.md
      - design/gdd/economy-ledger.md
      - design/gdd/offline-progression.md
    variables: [tau_req, omega_seg, eta_path, stalled]
    output_range: [0, 100000]
    expression: "P_recv = tau_req * omega_seg * eta_path if not stalled else 0"
    added: 2026-09-20
    revised: ""

  - name: work_integration
    status: active
    source: design/gdd/machine-processing.md
    referenced_by:
      - design/gdd/machine-processing.md
      - design/gdd/mechanical-power.md
      - design/gdd/economy-ledger.md
      - design/gdd/offline-progression.md
    variables: [workDone, P_recv, workRequired]
    output_range: [0, 20000]
    expression: "workDone += P_recv * 1s; complete when workDone >= workRequired"
    notes: "Decision 2026-09-20: pure power integration. energyPerBatch == workRequired exactly."
    added: 2026-09-20
    revised: ""

  - name: fuel_consumption
    status: active
    source: design/gdd/mechanical-power.md
    referenced_by:
      - design/gdd/mechanical-power.md
      - design/gdd/economy-ledger.md
      - design/gdd/offline-progression.md
    variables: [P_deliv_src, E_fuel, eta_engine]
    output_range: [0, 10]
    expression: "fuelPerTick = P_deliv_src / (E_fuel * eta_engine)"
    added: 2026-09-20
    revised: ""

  - name: market_quote
    status: active
    source: design/gdd/market-interface.md
    referenced_by:
      - design/gdd/market-interface.md
      - design/gdd/economy-ledger.md
    variables: [basePrice, spreadFraction]
    output_range: [0, 1000000]
    expression: "bid = basePrice*(1 - s/2); ask = basePrice*(1 + s/2)"
    notes: "Decision 2026-09-20: MVP LocalNpc = spread + volume limit, fixed prices"
    added: 2026-09-20
    revised: ""

  - name: profit_window
    status: active
    source: design/gdd/economy-ledger.md
    referenced_by:
      - design/gdd/economy-ledger.md
      - design/gdd/machine-inspection-ui.md
      - design/gdd/build-hud.md
      - design/gdd/tutorial-task.md
      - design/gdd/tech-unlock.md
    variables: [revenue_w, materialCost_w, fuelCost_w, otherCost_w]
    output_range: [-1000000, 1000000]
    expression: "profit_w = revenue_w - materialCost_w - fuelCost_w - otherCost_w"
    added: 2026-09-20
    revised: ""

  - name: loss_attribution
    status: active
    source: design/gdd/economy-ledger.md
    referenced_by:
      - design/gdd/economy-ledger.md
      - design/gdd/machine-inspection-ui.md
    variables: [ticks_reason, rate_theoretical, outputValuePerBatch]
    output_range: [0, 1000000]
    expression: "loss(m, reason) = ticks(m, reason) * rate_theoretical(m) * outputValuePerBatch(m)"
    notes: "Inspection Overview bottleneck = argmax over reasons in 60 s window"
    added: 2026-09-20
    revised: ""

  - name: tick_tiebreak_seed
    status: active
    source: design/gdd/tick-simulation.md
    referenced_by:
      - design/gdd/tick-simulation.md
      - design/gdd/conveyor.md
      - design/gdd/machine-processing.md
      - design/gdd/offline-progression.md
    variables: [osEntropy_256, tickIndex]
    output_range: [0, 18446744073709551615]
    expression: "tickSeed = H(osEntropy_256 || tickIndex)"
    notes: "Decision 2026-09-20: OS CSPRNG mixed per tick. MUST NOT derive from seed/save/tick/coords/ID alone (spec s1.3). Pathfinding tie-breaks do NOT use this."
    added: 2026-09-20
    revised: ""

