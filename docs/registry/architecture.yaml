# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────

forbidden_patterns:
  - pattern: direct_world_state_write
    status: active
    description: "No code outside TickEngine.Commit (IWorldWriter) may mutate simulation state. Systems submit Transactions in Collect."
    why: "Atomicity and snapshot semantics (tick-simulation GDD rules 2-5)."
    adr: docs/architecture/adr-0001-tick-transaction-engine.md
    added: 2026-09-20

  - pattern: read_post_commit_state_during_collect
    status: active
    description: "Collect must read only the TickSnapshot; reading live world state during Collect is a SnapshotViolation."
    why: "Order-independent results."
    adr: docs/architecture/adr-0001-tick-transaction-engine.md
    added: 2026-09-20

  - pattern: predictable_tie_break_seed
    status: active
    description: "Tie-break ordering must never be derived from world seed, save state, tick index alone, coordinates, transaction IDs, or wall clock; never persist the RNG state."
    why: "Spec s1.3 anti-manipulation requirement."
    adr: docs/architecture/adr-0002-tie-break-entropy.md
    added: 2026-09-20

  - pattern: tie_break_source_in_editing_or_preview
    status: active
    description: "Pathfinding, preview, and any UI tie-break must use a deterministic comparator; ITieBreakSource is forbidden outside Resolve/completion rolls."
    why: "Preview must not flicker (placement-editing rule 20)."
    adr: docs/architecture/adr-0002-tie-break-entropy.md
    added: 2026-09-20

  - pattern: index_based_serialization
    status: active
    description: "Saves and content data must reference containers/slots/ports by stable string keys, never array indices; items by canonical ItemId string."
    why: "Content updates reorder arrays (container GDD rule 6)."
    adr: docs/architecture/adr-0005-save-format.md
    added: 2026-09-20

  - pattern: persist_tag_expansion
    status: active
    description: "Never save expanded Tag membership or TagIds in place of concrete ItemIds."
    why: "Spec s2A.6."
    adr: docs/architecture/adr-0003-item-identity-and-content-format.md
    added: 2026-09-20

  - pattern: unity_types_in_simulation_assembly
    status: active
    description: "Equilibrium.Simulation, Equilibrium.Content, Equilibrium.Editing must not reference UnityEngine (beyond an explicitly approved math module if unavoidable)."
    why: "Headless tests and offline recompute."
    adr: docs/architecture/adr-0007-simulation-presentation-split.md
    added: 2026-09-20

  - pattern: physics_driven_logistics
    status: active
    description: "No colliders, rigidbodies, or physics callbacks for belts, items, pipes, or machines."
    why: "Spec s7.1; determinism."
    adr: docs/architecture/adr-0007-simulation-presentation-split.md
    added: 2026-09-20

  - pattern: visuals_inferring_state
    status: active
    description: "Presentation and UI may not derive or cache simulation truth from animation state; they consume CommittedEvents and IWorldView only."
    why: "Spec s1.1; glass-pipe rule 'visual never decides physics'."
    adr: docs/architecture/adr-0007-simulation-presentation-split.md
    added: 2026-09-20

  - pattern: ledger_writes_to_market
    status: active
    description: "EconomyLedger consumes market events; it never calls IMarketBackend or MarketSystem."
    why: "Breaks the economy-ledger <-> market-interface cycle."
    adr: docs/architecture/adr-0008-market-backend-interface.md
    added: 2026-09-20

  - pattern: ugui_for_new_ui
    status: active
    description: "No new UGUI Canvas UI. All screen-space UI is UI Toolkit."
    why: "Single UI stack; Unity 6 guidance."
    adr: docs/architecture/adr-0006-ui-technology-stack.md
    added: 2026-09-20

  - pattern: editor_code_in_player_assemblies
    status: active
    description: "Bake tools and editor utilities live only in Equilibrium.Editor (Assets/Editor)."
    why: "Spec s20."
    adr: docs/architecture/adr-0007-simulation-presentation-split.md
    added: 2026-09-20
