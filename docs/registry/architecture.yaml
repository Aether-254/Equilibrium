    not: "MonoBehaviour-per-block; DOTS Entities (deferred)"
    adr: docs/architecture/adr-0001-tick-transaction-engine.md
    reason: "Atomic transactions, headless tests, offline recompute; DOTS knowledge risk HIGH at current scale"
    referenced_by:
      - docs/architecture/adr-0001-tick-transaction-engine.md
      - docs/architecture/adr-0004-world-data-model.md
    added: 2026-09-20
    revised: ""

  - purpose: tie_break_randomness
    status: active
    api: "System.Security.Cryptography.RandomNumberGenerator.Fill per tick -> SplitMix64 -> Xoshiro256**"
    not: "UnityEngine.Random; System.Random(time); hash of world state; session-level seed"
