# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every GDD technical requirement.
# RULES: IDs are PERMANENT. Never renumber, never delete (status: deprecated).
#   Append new entries at the END of each system's list.
#   Reworded (same intent): update requirement text + revised date.
#   Removed: status: deprecated. Split/replaced: status: superseded-by: TR-x-NNN.
# WRITTEN BY: /architecture-review    READ BY: /create-stories, /story-done, /story-readiness
# ID FORMAT: TR-[system-slug]-[NNN]
# STATUS VALUES: active | deprecated | superseded-by: TR-[system]-NNN

